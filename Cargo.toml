[package]
name = "git-forge-exit-drill"
version = "0.1.0"
edition = "2024"
description = "Test a GitHub move before your team cuts over"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-git-forge-exit-drill"
keywords = ["github", "migration", "backup", "forgejo", "gitlab"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-forge-exit-drill"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.99"
argon2 = "0.5.3"
base64 = "0.22.1"
clap = { version = "4.5.46", features = ["derive"] }
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
ureq = { version = "2.12.1", features = ["json"] }
zeroize = "1.8.1"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.21.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
